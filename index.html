<h1>otp-reader</h1>
<p>A small tool I run for myself. It reads sign-in and verification code emails from one Gmail account that I own, and hands the code to my own scripts so I don't have to copy it by hand.</p>
<p>It is not a public service and nobody else signs in to it.</p>
<p><a href="privacy.html">Privacy policy</a></p>
<p>Questions: <a href="https://github.com/kenny-ish/otp-reader/issues">open an issue</a>.</p>
